name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test

  android-build:
    # Compiles Kotlin, the manifest and Gradle setup (reminders need
    # desugaring and receivers). The sandbox has no Android SDK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Merge the release manifest
        # Only the manifest merge: what every library adds to the shipped
        # app. (A full release build runs Android lint, which needs a newer
        # JDK than this job uses.)
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew --no-daemon :app:processReleaseMainManifest
      - name: Release manifest has no network permission
        # Kalan makes no network requests of its own. Play Billing needs
        # com.android.vending.BILLING; INTERNET must never be merged in.
        run: |
          manifest=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -n 1)
          test -n "$manifest"
          echo "Merged release manifest: $manifest"
          grep -o 'android.permission[^"]*\|com.android.vending.BILLING' "$manifest" | sort -u
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "INTERNET permission found in the release manifest"
            exit 1
          fi
