name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Untranslated list is committed
        # flutter pub get ran gen-l10n, which rewrites the messages still
        # waiting for the bulk translation (Roadmap 24): commit that file
        # with every ARB change.
        run: |
          git diff -- docs/ceviriler/cevrilecekler.json
          test -z "$(git status --porcelain -- docs/ceviriler/cevrilecekler.json)"
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test

  android-build:
    # Compiles Kotlin, the manifest and Gradle setup (reminders need
    # desugaring and receivers). The sandbox has no Android SDK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Merge the release manifest
        # Only the manifest merge: what every library adds to the shipped
        # app. (A full release build runs Android lint, which needs a newer
        # JDK than this job uses.)
        run: |
          flutter build apk --release --config-only
          cd android && ./gradlew --no-daemon :app:processReleaseMainManifest
      - name: Where each network permission comes from
        run: |
          report=$(find build/app/outputs/logs -name 'manifest-merger-release-report.txt' | head -n 1)
          test -n "$report" && grep -A4 'INTERNET\|ACCESS_NETWORK_STATE' "$report" || true
      - name: Release manifest has no network permission
        # Kalan makes no network requests of its own. Play Billing needs
        # com.android.vending.BILLING; INTERNET must never be merged in.
        run: |
          manifests=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml)
          test -n "$manifests"
          main=build/app/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
          if [ -f "$main" ]; then
            echo "Permissions in $main:"
            grep -o 'android.permission[^"]*\|com.android.vending.BILLING' "$main" | sort -u
          fi
          for m in $manifests; do
            if grep -q 'android.permission.INTERNET' "$m"; then
              echo "INTERNET permission found in $m"
              exit 1
            fi
          done
